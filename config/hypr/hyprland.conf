# uConsole Hyprland config for Debian 13 / Raspberry Pi kernel.
# HyDE-inspired port: compatible subset, without Arch-only HyDE scripts.

$mainMod = SUPER
$terminal = foot
$menu = env GDK_BACKEND=wayland,x11 QT_QPA_PLATFORM=wayland wofi --show drun
$fileManager = pcmanfm
$browser = chromium
$editor = code

env = XCURSOR_SIZE,28
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

source = ~/.cache/hypr/uconsole-monitors.conf

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = setsid -f ~/.local/bin/uconsole-display-autoswitch
exec-once = kanshi
exec-once = ~/.local/bin/uconsole-wallpaper apply
exec-once = hypridle
exec-once = env GDK_BACKEND=wayland,x11 QT_QPA_PLATFORM=wayland waybar
exec-once = dunst
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = /usr/libexec/hyprpolkitagent

input {
    kb_model = pc105
    kb_layout = us,latam
    kb_variant = ,
    kb_options = grp:alt_shift_toggle,compose:ralt
    numlock_by_default = false
    repeat_rate = 35
    repeat_delay = 250
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(93cee9ff) rgba(c79bf0ff) 45deg
    col.inactive_border = rgba(1f2328cc)
    layout = dwindle
}

decoration {
    rounding = 8
    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(00000088)
    }
    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }
}

animations {
    enabled = true
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = quick, 0.2, 0.8, 0.2, 1.0
    animation = windows, 1, 4, md3_decel, popin 80%
    animation = border, 1, 5, md3_standard
    animation = fade, 1, 4, md3_decel
    animation = workspaces, 1, 4, md3_decel, slide
}

dwindle {
    preserve_split = true
    smart_split = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

bind = $mainMod, Return, exec, $terminal
# Keep both terminal aliases because they are useful on the uConsole keyboard.
bind = $mainMod, T, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, grave, exec, ~/.local/bin/uconsole-lock
bind = $mainMod, TAB, exec, hyprctl --batch "dispatch cyclenext ; dispatch alterzorder top"
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, C, exec, $editor
bind = $mainMod, B, exec, $browser
bind = $mainMod, H, exec, ~/.local/bin/uconsole-hypr-help
bind = $mainMod SHIFT, H, exec, ~/.local/bin/uconsole-display-switch switch
bind = $mainMod SHIFT, B, exec, ~/.local/bin/uconsole-waybar-restart
bind = $mainMod SHIFT, T, exec, ~/.local/bin/uconsole-theme select
bind = $mainMod, W, exec, ~/.local/bin/uconsole-wallpaper select
bind = $mainMod SHIFT, W, exec, ~/.local/bin/uconsole-wallpaper select
bind = $mainMod SHIFT, period, exec, ~/.local/bin/uconsole-wallpaper next
bind = $mainMod SHIFT, comma, exec, ~/.local/bin/uconsole-wallpaper prev
bind = $mainMod SHIFT, C, exec, ~/.local/bin/uconsole-cava
bind = CTRL, Q, killactive
bind = ALT, F4, killactive
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod SHIFT, E, exit
bind = $mainMod, Delete, exit
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = SHIFT, F11, fullscreen
bind = $mainMod, F, fullscreen
bind = $mainMod, Space, togglefloating
bind = $mainMod, G, togglegroup
bind = $mainMod, S, togglespecialworkspace
bind = $mainMod SHIFT, S, movetoworkspace, special
bind = $mainMod SHIFT, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit
bind = ALT, Tab, cyclenext

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = CTRL, left, workspace, e-1
bind = CTRL, right, workspace, e+1

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod ALT, left, resizeactive, -40 0
bind = $mainMod ALT, right, resizeactive, 40 0
bind = $mainMod ALT, up, resizeactive, 0 -40
bind = $mainMod ALT, down, resizeactive, 0 40

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod CTRL, right, workspace, r+1
bind = $mainMod CTRL, left, workspace, r-1
bind = $mainMod CTRL, down, workspace, empty

bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && ~/.config/volume_osd.sh
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 2.0 @DEFAULT_AUDIO_SINK@ 5%+ && ~/.config/volume_osd.sh
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && ~/.config/volume_osd.sh
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10% && ~/.config/brightness_osd.sh
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%- && ~/.config/brightness_osd.sh
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

windowrule = idle_inhibit fullscreen, match:class ^(.*mpv.*)$|^(.*vlc.*)$|^(.*chromium.*)$
windowrule = opacity 0.90 0.90, match:class ^(chromium)$
windowrule = opacity 0.86 0.86, match:class ^([Cc]ode)$
windowrule = opacity 0.88 0.88, match:class ^(foot)$
windowrule = opacity 0.92 0.92, match:class ^(pcmanfm)$
windowrule = float true, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float true, match:class ^(nm-connection-editor)$
windowrule = center true, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = center true, match:class ^(nm-connection-editor)$

layerrule = blur true, match:namespace wofi
layerrule = ignore_alpha 0.2, match:namespace wofi
layerrule = blur true, match:namespace notifications
layerrule = ignore_alpha 0.2, match:namespace notifications
